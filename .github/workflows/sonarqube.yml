name: sonarqube
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    # Only in the starter itself: a project made from it copies this file, but
    # sonar-project.properties names the starter's project and the copy's token may
    # not scan into it. Projects are scanned by Fleet Control's code-scan.yml.
    if: github.repository == 'Qode-Fleet-Control/qode-laravel-template-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare app env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
